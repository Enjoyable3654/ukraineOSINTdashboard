<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#eef1f4;--fg:#1b2430;--mut:#5c6673;--card:#fff;--bd:#d3d9e0;--acc:#1f6f8b;--acct:#fff;--sea:#dfe8ef;--land:#f8f9f6;--warn:#fff3cd;--warnt:#5c4400;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--fg:#e6eaef;--mut:#95a0ad;--card:#1a222b;--bd:#2c3763;--bd:#2d3a48;--acc:#5fb3d0;--acct:#0b1a22;--sea:#182530;--land:#212c37;--warn:#3a3210;--warnt:#f0dc8a}}
:root[data-theme="dark"]{--bg:#12171d;--fg:#e6eaef;--mut:#95a0ad;--card:#1a222b;--bd:#2d3a48;--acc:#5fb3d0;--acct:#0b1a22;--sea:#182530;--land:#212c37;--warn:#3a3210;--warnt:#f0dc8a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.note{background:var(--warn);color:var(--warnt);padding:6px 14px;font-size:13px}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;padding:16px;max-width:1150px;margin:0 auto}
@media(max-width:760px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}
h1{font:600 20px Georgia,serif;margin:0}

.bar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#map{height:480px;border-radius:6px;border:1px solid var(--bd)}.ly{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin:4px 0}.ly button,.btn{border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:3px 10px}.btn{cursor:pointer;display:inline-block}

.cl{margin:6px 0 0;padding-left:16px;font-size:13px;color:var(--mut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.sum{margin-top:12px}
/* Dark mode: darken only the OSM map images (areas and dots keep their colours); nothing extra is requested from OSM */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.leaflet-container{background:var(--sea)}
</style></head><body>
<button id="theme" class="btn" style="position:fixed;top:8px;right:8px;z-index:1100" title="Switch between following your device, light and dark"></button>
<div class="wrap">
<aside>
 <div class="card"><h1>Daily archive</h1><p class="mut" style="margin:2px 0 10px">Pick a day to reload the whole dashboard as it was archived.</p><div id="cal"></div><div class="bar" style="margin:8px 0 0"><button class="btn" data-step="-1">‹ Previous day</button><button class="btn" data-step="1">Next day ›</button></div></div>
 <div class="card sum"><b>Day summary</b><p id="sum" class="mut" style="margin:6px 0 0"></p></div>
</aside>
<main>
 <h2 id="date"></h2><div class="mut" id="meta"></div>
 <div class="tabs" role="tablist"><button data-t="map">Map</button><button data-t="feat">Features</button><button data-t="post">Posts</button></div>
 <div id="mapPane"><div class="bar"><label class="btn">Add GeoTIFF<input type="file" id="gt" accept=".tif,.tiff,.geotiff" multiple hidden></label><span class="mut" id="gs">Files are read in your browser and never uploaded. You can also drop them on the map.</span></div><div id="lyrs"></div><div class="bar"><label class="mut">Change in Russian-occupied area compared with <select id="cp"><option value="1d">the previous day</option><option value="7d">7 days before</option><option value="30d">30 days before</option><option value="">(off)</option></select></label> <label class="mut"><input type="checkbox" id="cc" checked> Include contested areas in the numbers</label></div><div class="bar mut" id="cst"></div><div class="bar"><span class="mut" id="os"></span><span id="oc"></span></div><p id="tn" class="note" hidden></p><div id="map"></div></div>
 <div id="view"></div>
</main></div>
<p class="mut" style="text-align:center;margin:0 0 16px">Map data from OpenStreetMap. <a href="https://www.openstreetmap.org/fixthemap">Report a map issue</a></p>
<script>
const $=s=>document.querySelector(s);
/* Theme button: Auto (follow the device) -> Light -> Dark; the choice is remembered in this browser only */
const TH=["auto","light","dark"],rootEl=document.documentElement;let th=rootEl.dataset.theme||"auto";
const setTh=t=>{th=t;if(t=="auto")delete rootEl.dataset.theme;else rootEl.dataset.theme=t;$("#theme").textContent="Theme: "+t[0].toUpperCase()+t.slice(1);
 try{t=="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",t)}catch(e){}};
setTh(th);$("#theme").onclick=()=>{setTh(TH[(TH.indexOf(th)+1)%3]);drawOcc()};
const isDark=()=>rootEl.dataset.theme?rootEl.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;
const key=d=>new Date(d).toISOString().slice(0,10);
const A={};
for(let d=Date.UTC(2026,7,24);d<=Date.now();d+=864e5)A[key(d)]=1;
const map=L.map("map",{preferCanvas:true}).setView([48.6,31.2],6),rl=L.layerGroup().addTo(map);
/* Basemap config: change url/attr here to switch tile provider. */
const BASE={url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'};
const tn=$("#tn");
if(location.protocol=="file:"){tn.hidden=false;tn.textContent="This page was opened straight from your computer (file://), so the browser sends no Referer (a note saying which website is asking) and OpenStreetMap blocks the map tiles. To see the map, host the page (for example on GitHub Pages) or run a local server: python3 -m http.server 8000, then open http://localhost:8000/ in your browser."}
else{const tl=L.tileLayer(BASE.url,{maxZoom:19,attribution:BASE.attr,referrerPolicy:"strict-origin-when-cross-origin"}).addTo(map);
 let te=0;tl.on("tileerror",()=>{if(++te==3){tn.hidden=false;tn.textContent="Map tiles are not loading. Read the message written on a gray tile. If it mentions the Referer, a browser privacy setting, extension, or antivirus is probably removing it. See https://wiki.openstreetmap.org/wiki/Blocked_tiles"}})}
const now=new Date();let sel=key(now),view=[now.getUTCFullYear(),now.getUTCMonth()],tab="map";
function cal(){
 const[y,m]=view,f=new Date(Date.UTC(y,m,1)),off=(f.getUTCDay()+6)%7,n=new Date(Date.UTC(y,m+1,0)).getUTCDate();
 let h=`<div class="ch"><button data-m="-1" aria-label="Previous month">‹</button><b>${f.toLocaleString("en",{month:"long",year:"numeric",timeZone:"UTC"})}</b><button data-m="1" aria-label="Next month">›</button></div><div class="cg">`+"MTWTFSS".split("").map(d=>`<i>${d}</i>`).join("")+"<span></span>".repeat(off);
 for(let d=1;d<=n;d++){const k=key(Date.UTC(y,m,d)),a=A[k];
  h+=`<button class="d${a?" has":""}${k==sel?" on":""}" ${a?`data-d="${k}"`:"disabled"}>${d}</button>`}
 $("#cal").innerHTML=h+"</div>"}
function render(){
 cal();
 $("#date").textContent=new Date(sel+"T00:00:00Z").toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric",year:"numeric",timeZone:"UTC"});
 $("#meta").textContent="Archived snapshot";
 $("#sum").textContent="The LLM-written summary of the day, split by who claims what, will appear here.";
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 $("#mapPane").hidden=tab!="map";
 if(tab=="map")setTimeout(()=>map.invalidateSize(),0);
 let h="";
 if(tab=="feat")h=`<p class="mut">Real events are shown as dots on the Map tab. A list of them here is not built yet.</p>`;
 if(occFor!==sel){occFor=sel;loadOcc()}
 $("#view").innerHTML=h;drawPosts()}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-m],[data-d],[data-t],[data-step]");if(!b)return;
 if(b.dataset.m){const d=new Date(Date.UTC(view[0],view[1]+ +b.dataset.m,1));view=[d.getUTCFullYear(),d.getUTCMonth()]}
 else if(b.dataset.d)sel=b.dataset.d;
 else if(b.dataset.t)tab=b.dataset.t;
 else{const k=key(new Date(sel+"T00:00:00Z").getTime()+b.dataset.step*864e5);if(!A[k])return;sel=k;const d=new Date(k+"T00:00:00Z");view=[d.getUTCFullYear(),d.getUTCMonth()]}
 render()});
document.addEventListener("change",e=>{const d=e.target.dataset;if(d.oc){occOn[d.oc]=e.target.checked;drawOcc()}if(e.target.id=="cp"){occP=e.target.value;drawOcc()}if(e.target.id=="cc"){incC=e.target.checked;drawOcc()}
 if(d.pg){pgOn[d.pg]=e.target.checked;drawPosts()}if(d.pc){pcOn[d.pc]=e.target.checked;drawPosts()}});
document.addEventListener("input",e=>{if(e.target.id=="pq"){pq=e.target.value;listPosts()}});

/* Occupation polygons from data/<date>/<source>/polygons/occupation.geojson, built by the daily job */
map.createPane("occ").style.zIndex=450;
const ol=L.layerGroup().addTo(map),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let OCC=null,CATS={},SRCS={},PG={},POSTS=[],occOn={},pgOn={},pcOn={},occFor=null,pq="",occP="1d",META={},incC=true;
/* data files change daily: always ask GitHub whether there is a newer copy (fast "not modified" if not) */
const get=u=>fetch(u,{cache:"no-cache"});
async function loadOcc(){
 const day=sel;OCC=null;POSTS=[];META={};
 try{
  if(!Object.keys(CATS).length)CATS=(await(await get("data/categories.json")).json()).categories;
  if(!Object.keys(SRCS).length){const j=await(await get("data/sources.json")).json();SRCS=j.sources;PG=j.post_groups||{}}
  const meta=await(await get(`data/${day}/meta.json`)).json();META=meta.sources||{};
  /* each source lists its files in meta.json as <source>/<data type>/<specific data>.geojson */
  const files=Object.values(meta.sources||{}).filter(s=>s.status==="ok").flatMap(s=>s.files||[]).filter(f=>/\/polygons\/(occupation|change_\w+)\.geojson$/.test(f)||f.endsWith("/points/events.geojson")||f.endsWith("/points/fires.geojson"));
  const pf=Object.values(meta.sources||{}).filter(s=>s.status==="ok").flatMap(s=>s.files||[]).filter(f=>f.endsWith("/posts/posts.geojson"));
  files.sort((a,b)=>a.includes("/change_")-b.includes("/change_"));   /* change layers drawn on top */
  const parts=await Promise.all(files.concat(pf).map(async f=>{
   try{const r=await get(`data/${day}/${f}`);if(!r.ok)return[];return(await r.json()).features}catch(e){return[]}
  }));
  const all=parts.flat(),feats=all.filter(f=>f.geometry);
  if(day!==sel)return;
  POSTS=all.filter(f=>!f.geometry).map(f=>f.properties);
  OCC=feats.length?{type:"FeatureCollection",features:feats}:null
 }catch(e){}
 drawOcc();drawPosts()}
function drawOcc(){
 ol.clearLayers();const st=$("#os"),oc=$("#oc");
 const fs=OCC?OCC.features:[],has=new Set(fs.map(f=>f.properties.source));
 /* every source always gets a checkbox, even on days it has nothing */
 oc.innerHTML=Object.entries(SRCS).filter(([s,p])=>!p.group).map(([s,p])=>`<label><input type="checkbox" data-oc="${esc(s)}" ${occOn[s]===false?"":"checked"}> <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>${has.has(s)?"":' <span class="mut">(nothing this day)</span>'}</label> `).join("");
 /* change numbers for each ticked area source, for the selected comparison */
 const n=v=>v.toLocaleString("en",{maximumFractionDigits:1});
 $("#cst").innerHTML=occP?Object.entries(META).filter(([s,m])=>m.change_stats&&occOn[s]!==false).map(([s,m])=>{const c=m.change_stats[occP],nm=esc(SRCS[s]?.name||s);
  if(!c||!c.km2)return`${nm}: no map ${occP} earlier to compare with`;
  const k=c.km2,ru=incC?[["newly occupied",k.u2r],["newly contested",k.u2c]]:[["from Ukrainian-held",k.u2r],["from contested",k.c2r]],
   ua=incC?[["from occupied",k.r2u],["from contested",k.c2u]]:[["back to Ukrainian-held",k.r2u],["now contested",k.r2c]],
   sum=a=>a.reduce((t,x)=>t+x[1],0),part=a=>a.map(x=>`${x[0]} ${n(x[1])}`).join(", "),net=sum(ru)-sum(ua);
  return`<b>${nm}</b> vs ${esc(c.compared_with)}, ${incC?"occupied or contested":"occupied only"}: Russian advance +${n(sum(ru))} km² (${part(ru)}) · Ukrainian advance +${n(sum(ua))} km² (${part(ua)}) · net change in Russian-${incC?"held":"occupied"} area ${net>=0?"+":"−"}${n(Math.abs(net))} km²`}).join("<br>"):"";
 if(!OCC){st.textContent="No map data for this day yet. Sources: ";return}
 const pt=f=>f.geometry.type=="Point",per=f=>!f.properties.period||f.properties.period===occP,
  cs=[...new Set(fs.filter(f=>!pt(f)&&per(f)).map(f=>f.properties.category))],ct=c=>CATS[c]||{},
  dk=isDark(),col=c=>(dk&&ct(c).color_dark)||ct(c).color||"#444",out=c=>(dk&&ct(c).outline_dark)||ct(c).outline;
 st.innerHTML=(cs.length?"Areas: "+cs.map(c=>`<span class="dot" style="background:${esc(col(c))};${out(c)?`box-shadow:0 0 0 2px ${esc(out(c))}`:""}"></span>${esc(ct(c).label||c)}`).join(" ")+" · ":"")+"Sources: ";
 L.geoJSON(OCC,{pane:"occ",filter:f=>occOn[f.properties.source]!==false&&per(f),
  pointToLayer:(f,ll)=>L.circleMarker(ll,{pane:"markerPane",radius:f.properties.radius||6}),
  style:f=>{if(pt(f))return{color:"#fff",weight:f.properties.radius?.5:1.5,fillColor:f.properties.color,fillOpacity:.9};const c=f.properties.category,k=col(c);return f.properties.period?(out(c)?{color:out(c),weight:2.5,fillColor:k,fillOpacity:.5}:{color:k,weight:1,fillColor:k,fillOpacity:.65}):{color:k,weight:1.5,fillColor:k,fillOpacity:.3}},
  onEachFeature:(f,l)=>{const p=f.properties;if(pt(f))return l.bindPopup(evPop(p),{maxWidth:340});l.bindPopup(`<b>${esc(p.category_label)}</b><br>Source: ${esc(p.source_name)} (map of ${esc(p.snapshot_time)})<br>`+
   (p.period?`Compared with ${esc(p.compared_with)}`:`Original types: ${esc(p.source_labels.join("; "))}`)+`<br>Approx. area: ${esc(p.area_km2_approx.toLocaleString())} km²`)}}).addTo(ol)}
/* Posts tab: Telegram posts of the selected day, filterable by group and by channel; text as posted, media only linked */
/* Search: words (all must appear), AND, OR, NOT, (brackets), "exact phrases"; not case-sensitive.
   Returns a test function, or null if the search can't be read (e.g. an extra closing bracket). */
function qparse(q){
 const t=q.match(/"[^"]*"|\(|\)|[^\s()"]+/g)||[],up=()=>(t[i]||"").toUpperCase(),terms=[];let i=0,neg=false;
 const orx=()=>{let a=andx();while(up()=="OR"){i++;const l=a,r=andx();a=x=>l(x)||r(x)}return a},
  andx=()=>{let a=notx();while(i<t.length&&up()!="OR"&&t[i]!=")"){if(up()=="AND")i++;const l=a,r=notx();a=x=>l(x)&&r(x)}return a},
  notx=()=>{if(up()=="NOT"){i++;neg=!neg;const f=notx();neg=!neg;return x=>!f(x)}if(t[i]=="("){i++;const f=orx();if(t[i]==")")i++;return f}
   const w=(t[i++]||"").replace(/"/g,"").toLowerCase();if(w&&!neg)terms.push(w);return x=>x.includes(w)};
 const f=orx();f.terms=terms;return i<t.length?null:f}
/* Post text with the searched words and phrases highlighted (not the ones after NOT) */
const hl=(t,ws)=>{if(!ws||!ws.length)return esc(t);
 const re=new RegExp("("+ws.slice().sort((a,b)=>b.length-a.length).map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","giu");
 return t.split(re).map((x,i)=>i%2?`<mark>${esc(x)}</mark>`:esc(x)).join("")};
function drawPosts(){
 if(tab!="post")return;
 const cb=(k,v,on,l)=>`<label><input type="checkbox" data-${k}="${esc(v)}" ${on[v]===false?"":"checked"}> ${l}</label> `;
 $("#view").innerHTML=`<div class="bar"><span>${Object.entries(PG).map(([g,l])=>cb("pg",g,pgOn,esc(l))).join("")}</span></div>`+
  `<div class="bar"><span class="mut">Channels: ${Object.entries(SRCS).filter(([s,p])=>p.group).map(([s,p])=>cb("pc",s,pcOn,`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>`)).join("")}</span></div>`+
  `<input id="pq" type="search" value="${esc(pq)}" placeholder='Search posts, e.g. дрон AND (Харків OR Суми) NOT навчання' style="width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)">`+
  `<p class="mut" style="margin:4px 0 8px">Words must all appear. Use OR, NOT, (brackets) and "exact phrases". Posts are in their original language.</p><div id="plist"></div>`;
 listPosts()}
function listPosts(){
 const f=pq.trim()?qparse(pq):null,bad=pq.trim()&&!f;
 const ps=POSTS.filter(p=>pgOn[p.group]!==false&&pcOn[p.source]!==false&&(!f||f(p.text.toLowerCase()))).sort((a,b)=>a.posted_utc<b.posted_utc?1:-1);
 $("#plist").innerHTML=(bad?`<p class="mut">Couldn't read that search (check the brackets), so it is not applied.</p>`:"")+`<p class="mut">${ps.length} of ${POSTS.length} posts</p>`+
  (ps.length?ps.map(p=>`<div class="row"><span class="mut">${esc(p.source_name)} · ${esc(PG[p.group]||p.group)} · ${esc(p.posted_utc.slice(11,16))} UTC</span>`+
   `<p style="white-space:pre-line;overflow-wrap:anywhere;margin:6px 0">${hl(p.text,f&&f.terms)}</p><div style="overflow-wrap:anywhere">${p.links.map(lk).join("<br>")}${p.links.length?"<br>":""}`+
   `<a href="${esc(p.link)}" target="_blank" rel="noopener">Open original post</a></div></div>`).join(""):`<p class="mut">No posts for this day with these filters.</p>`)}
/* Event popup (GeoConfirmed, WarSpotting, Telegram, war-fire model): fields copied as each source gives them; media are only linked, never embedded */
const lk=u=>/^https?:\/\//.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`:esc(u);
const evPop=p=>`<div style="overflow-wrap:anywhere"><b>${esc(p.category)}</b><br><span class="mut">${esc(p.date)}${p.date_note?` (${esc(p.date_note)})`:""} · ${esc(p.side)}</span><p style="white-space:pre-line">${esc(p.description)}</p>`+
 (p.orbat.length?`<b>ORBAT:</b> ${p.orbat.map(esc).join("; ")}<br>`:"")+
 (p.geolocation?`<b>Geolocation:</b><br>${p.geolocation.map(lk).join("<br>")||"none listed"}<br>`:"")+(p.sources?`<b>Sources:</b><br>${p.sources.map(lk).join("<br>")||"none listed"}<br>`:"")+
 `<b>Source:</b> <a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.source_name)} (original)</a></div>`;
/* GeoTIFF upload: parsed and reprojected in the browser, nothing leaves the device */
const RL=[];
function crs(c){
 if(c==4326)return"EPSG:4326";if(c==3857||c==900913)return"EPSG:3857";
 if(c>=32601&&c<=32660)return`+proj=utm +zone=${c-32600} +datum=WGS84 +units=m +no_defs`;
 if(c>=32701&&c<=32760)return`+proj=utm +zone=${c-32700} +south +datum=WGS84 +units=m +no_defs`;
 if(c>=25828&&c<=25838)return`+proj=utm +zone=${c-25800} +ellps=GRS80 +units=m +no_defs`;
 return null}
async function addTiff(file){
 const st=$("#gs");st.textContent="Reading "+file.name+"...";
 try{
  const t=await GeoTIFF.fromBlob(file),im=await t.getImage(),g=im.getGeoKeys(),
   code=g.ProjectedCSTypeGeoKey&&g.ProjectedCSTypeGeoKey!=32767?g.ProjectedCSTypeGeoKey:g.GeographicTypeGeoKey,def=crs(code);
  if(!def)throw Error("unsupported coordinate system (EPSG:"+code+"). Reproject it to EPSG:4326, 3857 or UTM first");
  const W=im.getWidth(),H=im.getHeight(),k=Math.min(1,1400/Math.max(W,H)),w=Math.round(W*k),h=Math.round(H*k),bb=im.getBoundingBox();
  const ras=await im.readRasters({width:w,height:h}),nd=im.getGDALNoData(),bands=ras.length>=3?[0,1,2]:[0];
  const lim=bands.map(i=>{const a=ras[i];if(a instanceof Uint8Array)return[0,255];const v=[];
   for(let j=0;j<a.length;j+=7)if(a[j]&&a[j]!==nd&&a[j]===a[j])v.push(a[j]);v.sort((p,q)=>p-q);return[v[v.length*.02|0]||0,v[v.length*.98|0]||1]});
  st.textContent="Placing "+file.name+" on the map...";await new Promise(r=>setTimeout(r,30));
  const to=proj4(def,"EPSG:3857"),cs=[[bb[0],bb[1]],[bb[2],bb[1]],[bb[0],bb[3]],[bb[2],bb[3]]].map(p=>to.forward(p)),
   xs=cs.map(p=>p[0]),ys=cs.map(p=>p[1]),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),
   sc=1400/Math.max(maxx-minx,maxy-miny),ow=Math.round((maxx-minx)*sc),oh=Math.round((maxy-miny)*sc),
   cv=document.createElement("canvas");cv.width=ow;cv.height=oh;
  const cx=cv.getContext("2d"),img=cx.createImageData(ow,oh),d=img.data,n=bands.length;
  for(let y=0;y<oh;y++)for(let x=0;x<ow;x++){
   const p=to.inverse([minx+(x+.5)/sc,maxy-(y+.5)/sc]),u=Math.floor((p[0]-bb[0])/(bb[2]-bb[0])*w),v=Math.floor((bb[3]-p[1])/(bb[3]-bb[1])*h);
   if(u<0||v<0||u>=w||v>=h)continue;
   const o=v*w+u,q=(y*ow+x)*4,c=[0,0,0];let z=1,bad=0;
   for(let i=0;i<3;i++){const j=n>1?i:0,val=ras[bands[j]][o];if(val===nd||val!==val)bad=1;if(val)z=0;c[i]=(val-lim[j][0])/(lim[j][1]-lim[j][0]||1)*255}
   if(bad||z)continue;d[q]=c[0];d[q+1]=c[1];d[q+2]=c[2];d[q+3]=255}
  cx.putImageData(img,0,0);
  const ll=p=>{const a=proj4("EPSG:3857","EPSG:4326",p);return[a[1],a[0]]},bounds=[ll([minx,miny]),ll([maxx,maxy])];
  RL.push({name:file.name,layer:L.imageOverlay(cv.toDataURL(),bounds,{opacity:.85}).addTo(rl),bounds});
  map.fitBounds(bounds);lyr();st.textContent="Loaded "+file.name+"."
 }catch(e){st.textContent="Could not load "+file.name+": "+e.message}}
function lyr(){$("#lyrs").innerHTML=RL.map((r,i)=>`<div class="ly"><b>${r.name.replace(/[<&>]/g,"")}</b><input type="range" min="0" max="1" step=".05" value="${r.layer.options.opacity}" data-o="${i}" aria-label="Opacity"><button data-z="${i}">Zoom to</button><button data-x="${i}">Remove</button></div>`).join("")}
const addAll=fs=>[...fs].reduce((p,f)=>p.then(()=>addTiff(f)),Promise.resolve());
$("#gt").onchange=e=>{addAll(e.target.files);e.target.value=""};
$("#map").ondragover=e=>e.preventDefault();$("#map").ondrop=e=>{e.preventDefault();addAll(e.dataTransfer.files)};
$("#lyrs").oninput=e=>{const i=e.target.dataset.o;if(i!=null)RL[i].layer.setOpacity(e.target.value)};
$("#lyrs").onclick=e=>{const b=e.target.dataset;if(b.z)map.fitBounds(RL[b.z].bounds);if(b.x){rl.removeLayer(RL[b.x].layer);RL.splice(b.x,1);lyr()}};
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>drawOcc());
render();
