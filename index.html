<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Ukraine OSINT Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/proj4@2.9.2/dist/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js"></script>
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--bg:#eef1f4;--fg:#1b2430;--mut:#5c6673;--card:#fff;--bd:#d3d9e0;--acc:#1f6f8b;--acct:#fff;--sea:#dfe8ef;--warn:#fff3cd;--warnt:#5c4400}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--fg:#e6eaef;--mut:#95a0ad;--card:#1a222b;--bd:#2d3a48;--acc:#5fb3d0;--acct:#0b1a22;--sea:#182530;--warn:#3a3210;--warnt:#f0dc8a}}
:root[data-theme="dark"]{--bg:#12171d;--fg:#e6eaef;--mut:#95a0ad;--card:#1a222b;--bd:#2d3a48;--acc:#5fb3d0;--acct:#0b1a22;--sea:#182530;--warn:#3a3210;--warnt:#f0dc8a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
a{color:var(--acc)}
.mut{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:6px;padding:4px 10px}
.btn.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
/* full-screen map with floating overlays */
#map{position:fixed;inset:0}
.ov{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
#tl{position:fixed;top:10px;left:10px;z-index:1000;display:flex;flex-direction:column;align-items:flex-start;gap:6px;max-width:calc(100vw - 20px)}
.tb{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:4px}
#ps{width:220px;border:1px solid var(--bd);border-radius:6px;padding:4px 8px;background:var(--card)}
.drop{padding:10px;width:min(440px,calc(100vw - 20px));max-height:calc(100vh - 80px);overflow:auto}
.drop h3{font-size:13px;margin:10px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.drop h3:first-child{margin-top:0}
#rt{position:fixed;top:10px;right:10px;z-index:1002;display:flex;gap:4px;padding:4px}
#panel{position:fixed;top:0;right:0;bottom:0;width:460px;z-index:1001;display:flex;flex-direction:column;border-radius:0;border-width:0 0 0 1px}
body.pan #map{right:460px}body.pan #rt{right:470px}
.pb{overflow:auto;flex:1;padding:10px}
#tn{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:1000;padding:8px 12px;max-width:90vw;background:var(--warn);color:var(--warnt)}
@media(max-width:700px){#ps{width:150px}#rt{top:auto;bottom:10px}body.pan #map{right:0}body.pan #rt{right:10px}#panel{top:auto;left:0;right:0;bottom:58px;width:100%;height:65vh;border-radius:12px 12px 0 0;border-width:1px}}
/* calendar */
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ch button{border:1px solid var(--bd);background:none;border-radius:6px;width:30px;height:28px}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cg i{font-style:normal;font-size:12px;color:var(--mut)}
.d{border:1px solid transparent;background:none;border-radius:6px;height:34px;padding:0}
.d:disabled{color:var(--mut);opacity:.45;cursor:default}
.d.has{background:var(--sea);border-color:var(--bd)}
.d.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
/* lists */
.row{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;margin-bottom:8px;overflow-wrap:anywhere}
.ly{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin:4px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.fi{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card)}
.res button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--bd);background:none;padding:6px 4px}
/* Dark mode: darken only the OSM map images (areas and dots keep their colours); nothing extra is requested from OSM */
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.leaflet-container{background:var(--sea)}
</style></head><body>
<div id="map"></div>
<div id="tl">
 <div class="ov tb">
  <button class="btn" data-step="-1" title="Previous day" aria-label="Previous day">‹</button>
  <button class="btn" id="dbtn" data-drop="calbox" title="Pick a day"></button>
  <button class="btn" data-step="1" title="Next day" aria-label="Next day">›</button>
  <button class="btn" id="psb" title="Search places" aria-label="Search places">🔍</button><input id="ps" type="search" placeholder="Search places (English or Ukrainian)" autocomplete="off" aria-label="Search places" hidden>
  <button class="btn" data-drop="lay">Layers ▾</button>
  <button class="btn" data-drop="sumbox">Summary ▾</button>
  <button class="btn" id="theme" title="Theme"></button>
 </div>
 <div id="calbox" class="ov drop" hidden><div id="cal"></div></div>
 <div id="sres" class="ov drop res" hidden></div>
 <div id="sumbox" class="ov drop" hidden><h3>Day summary</h3><div id="sum" class="mut" style="white-space:pre-line;overflow-wrap:anywhere"></div></div>
 <div id="lay" class="ov drop" hidden>
  <h3>Change in Russian-occupied area</h3>
  <label class="mut">Compared with <select id="cp"><option value="1d">the previous day</option><option value="7d">7 days before</option><option value="30d">30 days before</option><option value="">(off)</option></select></label><br>
  <label class="mut"><input type="checkbox" id="cc" checked> Include contested areas in the numbers</label>
  <div id="cst" class="mut" style="margin-top:6px"></div>
  <h3>Map legend</h3><div id="os" class="mut"></div>
  <h3>Sources</h3><div id="oc"></div>
  <h3>Your own images</h3>
  <label class="btn">Add GeoTIFF<input type="file" id="gt" accept=".tif,.tiff,.geotiff" multiple hidden></label>
  <div id="gs" class="mut" style="margin-top:4px">Files are read in your browser and never uploaded. You can also drop them on the map.</div><div id="lyrs"></div>
 </div>
</div>
<div id="rt" class="ov"><button class="btn" data-panel="post">Posts</button><button class="btn" data-panel="feat">Features</button></div>
<aside id="panel" class="ov" hidden><div id="pp" class="pb" hidden></div><div id="pf" class="pb" hidden></div></aside>
<p id="tn" class="ov" hidden></p>
<script>
const $=s=>document.querySelector(s);
/* Theme button: Auto (follow the device) -> Light -> Dark; the choice is remembered in this browser only */
const TH=["auto","light","dark"],rootEl=document.documentElement;let th=rootEl.dataset.theme||"auto";
const setTh=t=>{th=t;if(t=="auto")delete rootEl.dataset.theme;else rootEl.dataset.theme=t;$("#theme").textContent=({auto:"◐",light:"☀",dark:"☾"})[t];$("#theme").title="Theme: "+t+" (click to change)";
 try{t=="auto"?localStorage.removeItem("theme"):localStorage.setItem("theme",t)}catch(e){}};
setTh(th);$("#theme").onclick=()=>{setTh(TH[(TH.indexOf(th)+1)%3]);drawOcc()};
const isDark=()=>rootEl.dataset.theme?rootEl.dataset.theme=="dark":matchMedia("(prefers-color-scheme: dark)").matches;
const key=d=>new Date(d).toISOString().slice(0,10);
const A={};
for(let d=Date.UTC(2026,7,24);d<=Date.now();d+=864e5)A[key(d)]=1;
const map=L.map("map",{preferCanvas:true,zoomControl:false}).setView([48.6,31.2],6),rl=L.layerGroup().addTo(map);
map.attributionControl.setPosition("bottomleft");L.control.zoom({position:"bottomleft"}).addTo(map);   /* OSM credit at the very bottom, under the zoom buttons */
/* Basemap config: change url/attr here to switch tile provider. */
const BASE={url:"https://tile.openstreetmap.org/{z}/{x}/{y}.png",attr:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · <a href="https://www.openstreetmap.org/fixthemap">Report a map issue</a> · Places: OCHA / Kartographia (CC BY 3.0 IGO)'};
const tn=$("#tn");
if(location.protocol=="file:"){tn.hidden=false;tn.textContent="This page was opened straight from your computer (file://), so the browser sends no Referer (a note saying which website is asking) and OpenStreetMap blocks the map tiles. To see the map, host the page (for example on GitHub Pages) or run a local server: python3 -m http.server 8000, then open http://localhost:8000/ in your browser."}
else{const tl=L.tileLayer(BASE.url,{maxZoom:19,attribution:BASE.attr,referrerPolicy:"strict-origin-when-cross-origin"}).addTo(map);
 let te=0;tl.on("tileerror",()=>{if(++te==3){tn.hidden=false;tn.textContent="Map tiles are not loading. Read the message written on a gray tile. If it mentions the Referer, a browser privacy setting, extension, or antivirus is probably removing it. See https://wiki.openstreetmap.org/wiki/Blocked_tiles"}})}
const now=new Date();let sel=key(now),view=[now.getUTCFullYear(),now.getUTCMonth()];
/* left dropdowns (calendar, search results, summary, layers): one open at a time */
const DROPS=["calbox","sres","sumbox","lay"],drop=id=>DROPS.forEach(d=>$("#"+d).hidden=d!==id||!$("#"+d).hidden);
/* right panels (posts, features): one open at a time; each remembers where you had scrolled */
let panel=null;const scr={};
const showPanel=p=>{if(panel)scr[panel]=$(panel=="post"?"#pp":"#pf").scrollTop;panel=p===panel?null:p;
 $("#panel").hidden=!panel;$("#pp").hidden=panel!="post";$("#pf").hidden=panel!="feat";
 document.body.classList.toggle("pan",!!panel);map.invalidateSize();
 document.querySelectorAll("[data-panel]").forEach(b=>b.classList.toggle("on",b.dataset.panel==panel));
 if(panel)$(panel=="post"?"#pp":"#pf").scrollTop=scr[panel]||0};
function cal(){
 const[y,m]=view,f=new Date(Date.UTC(y,m,1)),off=(f.getUTCDay()+6)%7,n=new Date(Date.UTC(y,m+1,0)).getUTCDate();
 let h=`<div class="ch"><button data-m="-1" aria-label="Previous month">‹</button><b>${f.toLocaleString("en",{month:"long",year:"numeric",timeZone:"UTC"})}</b><button data-m="1" aria-label="Next month">›</button></div><div class="cg">`+"MTWTFSS".split("").map(d=>`<i>${d}</i>`).join("")+"<span></span>".repeat(off);
 for(let d=1;d<=n;d++){const k=key(Date.UTC(y,m,d)),a=A[k];
  h+=`<button class="d${a?" has":""}${k==sel?" on":""}" ${a?`data-d="${k}"`:"disabled"}>${d}</button>`}
 $("#cal").innerHTML=h+"</div>"}
function render(){
 cal();
 $("#dbtn").textContent=new Date(sel+"T00:00:00Z").toLocaleDateString("en",{weekday:"short",day:"numeric",month:"short",year:"numeric",timeZone:"UTC"})+" ▾";
 if(occFor!==sel){occFor=sel;loadOcc()}}
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-m],[data-d],[data-step],[data-drop],[data-panel],[data-go],[data-pl]");if(!b)return;
 const d=b.dataset;
 if(d.drop)return drop(d.drop);
 if(d.panel)return showPanel(d.panel);
 if(d.go)return goFeat(+d.go);
 if(d.pl)return goPlace(+d.pl);
 if(d.m){const t=new Date(Date.UTC(view[0],view[1]+ +d.m,1));view=[t.getUTCFullYear(),t.getUTCMonth()]}
 else if(d.d){sel=d.d;drop(null)}
 else{const k=key(new Date(sel+"T00:00:00Z").getTime()+d.step*864e5);if(!A[k])return;sel=k;const t=new Date(k+"T00:00:00Z");view=[t.getUTCFullYear(),t.getUTCMonth()]}
 render()});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){drop(null);if(panel)showPanel(panel)}});
document.addEventListener("change",e=>{const d=e.target.dataset;if(d.oc){occOn[d.oc]=e.target.checked;drawOcc()}if(e.target.id=="cp"){occP=e.target.value;drawOcc()}if(e.target.id=="cc"){incC=e.target.checked;drawOcc()}
 if(d.ff){fOn[d.ff]=e.target.checked;listFeat()}if(d.pg){pgOn[d.pg]=e.target.checked;drawPosts()}if(d.pc){pcOn[d.pc]=e.target.checked;drawPosts()}});
document.addEventListener("input",e=>{if(e.target.id=="pq"){pq=e.target.value;listPosts()}if(e.target.id=="fq"){fq=e.target.value;listFeat()}if(e.target.id=="ps")findPlace(e.target.value)});

/* Map data from data/<date>/<source>/..., built by the daily job */
map.createPane("occ").style.zIndex=450;
const ol=L.layerGroup().addTo(map),esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let OCC=null,CATS={},SRCS={},PG={},POSTS=[],FL=[],occOn={},pgOn={},pcOn={},occFor=null,pq="",fq="",fOn={},occP="1d",META={},incC=true;
/* data files change daily: always ask GitHub whether there is a newer copy (fast "not modified" if not) */
const get=u=>fetch(u,{cache:"no-cache"});
/* big data files are stored gzip-compressed (lossless); the browser unpacks them here */
const getJson=async u=>{const r=await get(u);if(!r.ok)throw Error(r.status);return u.endsWith(".gz")?new Response(r.body.pipeThrough(new DecompressionStream("gzip"))).json():r.json()};
async function loadOcc(){
 const day=sel;OCC=null;POSTS=[];META={};
 try{
  if(!Object.keys(CATS).length)CATS=(await(await get("data/categories.json")).json()).categories;
  if(!Object.keys(SRCS).length){const j=await(await get("data/sources.json")).json();SRCS=j.sources;PG=j.post_groups||{}}
  const meta=await(await get(`data/${day}/meta.json`)).json();META=meta.sources||{};
  /* each source lists its files in meta.json as <source>/<data type>/<specific data>.geojson */
  const files=Object.values(meta.sources||{}).filter(s=>s.status==="ok").flatMap(s=>s.files||[]).filter(f=>/^(events\/points\/events|[^/]+\/points\/fires|[^/]+\/polygons\/(occupation|change_\w+))\.geojson(\.gz)?$/.test(f));
  const pf=Object.values(meta.sources||{}).filter(s=>s.status==="ok").flatMap(s=>s.files||[]).filter(f=>f.endsWith("/posts/posts.geojson"));
  files.sort((a,b)=>a.includes("/change_")-b.includes("/change_"));   /* change layers drawn on top */
  const parts=await Promise.all(files.concat(pf).map(async f=>{
   try{return(await getJson(`data/${day}/${f}`)).features}catch(e){return[]}
  }));
  const all=parts.flat(),feats=all.filter(f=>f.geometry);
  if(day!==sel)return;
  POSTS=all.filter(f=>!f.geometry).map(f=>f.properties);
  OCC=feats.length?{type:"FeatureCollection",features:feats}:null
 }catch(e){}
 drawOcc();drawPosts();drawSum(day)}
/* Day summary: written by Gemini from that day's saved material, labelled as AI-written; errors are shown as they are */
async function drawSum(day){
 const m=META.daily_summary,el=$("#sum");
 if(!m){el.textContent="No summary for this day yet.";return}
 if(m.status!="ok"){el.textContent=m.error||"Summary could not be generated.";return}
 try{const j=await(await get(`data/${day}/${m.files[0]}`)).json();if(day!==sel)return;
  el.innerHTML=`<i>AI-written by ${esc(j.model)} from ${j.input_items} saved items; it can make mistakes, so check the sources.</i>\n\n`+esc(j.text).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+ ?(.*)$/gm,"<b>$1</b>")}
 catch(e){el.textContent="The summary file could not be loaded."}}
function drawOcc(){
 ol.clearLayers();FL=[];const st=$("#os"),oc=$("#oc");
 const fs=OCC?OCC.features:[],has=new Set(fs.map(f=>f.properties.source));
 /* every map source always gets a checkbox, even on days it has nothing */
 oc.innerHTML=Object.entries(SRCS).filter(([s,p])=>!p.group&&!["place_stats","daily_summary","events"].includes(s)).map(([s,p])=>`<div><label><input type="checkbox" data-oc="${esc(s)}" ${occOn[s]===false?"":"checked"}> <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>${has.has(s)?"":' <span class="mut">(nothing this day)</span>'}</label></div>`).join("");
 /* change numbers for each ticked area source, for the selected comparison */
 const n=v=>v.toLocaleString("en",{maximumFractionDigits:1});
 $("#cst").innerHTML=occP?Object.entries(META).filter(([s,m])=>m.change_stats&&occOn[s]!==false).map(([s,m])=>{const c=m.change_stats[occP],nm=esc(SRCS[s]?.name||s);
  if(!c||!c.km2)return`${nm}: no map ${occP} earlier to compare with`;
  const k=c.km2,ru=incC?[["newly occupied",k.u2r],["newly contested",k.u2c]]:[["from Ukrainian-held",k.u2r],["from contested",k.c2r]],
   ua=incC?[["from occupied",k.r2u],["from contested",k.c2u]]:[["back to Ukrainian-held",k.r2u],["now contested",k.r2c]],
   sum=a=>a.reduce((t,x)=>t+x[1],0),part=a=>a.map(x=>`${x[0]} ${n(x[1])}`).join(", "),net=sum(ru)-sum(ua);
  return`<b>${nm}</b> vs ${esc(c.compared_with)}, ${incC?"occupied or contested":"occupied only"}: Russian advance +${n(sum(ru))} km² (${part(ru)}) · Ukrainian advance +${n(sum(ua))} km² (${part(ua)}) · net change in Russian-${incC?"held":"occupied"} area ${net>=0?"+":"−"}${n(Math.abs(net))} km²`}).join("<br>")||"No change numbers for the ticked sources on this day.":"Pick a comparison above to see change numbers.";
 if(!OCC){st.textContent="No map data for this day yet.";drawFeat();return}
 const pt=f=>f.geometry.type=="Point",per=f=>!f.properties.period||f.properties.period===occP,
  cs=[...new Set(fs.filter(f=>!pt(f)&&per(f)).map(f=>f.properties.category))],ct=c=>CATS[c]||{},
  dk=isDark(),col=c=>(dk&&ct(c).color_dark)||ct(c).color||"#444",out=c=>(dk&&ct(c).outline_dark)||ct(c).outline;
 st.innerHTML=cs.map(c=>`<div><span class="dot" style="background:${esc(col(c))};${out(c)?`box-shadow:0 0 0 2px ${esc(out(c))}`:""}"></span>${esc(ct(c).label||c)}</div>`).join("")||"No areas on this day.";
 L.geoJSON(OCC,{pane:"occ",filter:f=>(f.properties.claim_sources||[f.properties.source]).some(s=>occOn[s]!==false)&&per(f),
  pointToLayer:(f,ll)=>L.circleMarker(ll,{pane:"markerPane",radius:f.properties.radius||6}),
  style:f=>{if(pt(f))return{color:(f.properties.claims||[]).length>1?"#000":"#fff",weight:f.properties.radius?.5:(f.properties.claims||[]).length>1?3:1.5,fillColor:f.properties.color,fillOpacity:.9};const c=f.properties.category,k=col(c);return f.properties.period?(out(c)?{color:out(c),weight:2.5,fill:false}:{color:k,weight:1,fillColor:k,fillOpacity:.65}):{color:k,weight:1.5,fillColor:k,fillOpacity:.3}},
  onEachFeature:(f,l)=>{const p=f.properties;
   /* the Features panel lists map events and change patches (not war fires, not the base areas) */
   if((pt(f)&&p.source!="economist_fires")||p.period)FL.push({f,l});
   if(pt(f))return l.bindPopup(p.claims?evPopE(p):evPop(p),{maxWidth:360,maxHeight:420});l.bindPopup(`<b>${esc(p.category_label)}</b><br>Source: ${esc(p.source_name)} (map of ${esc(p.snapshot_time)})<br>`+
   (p.period?`Compared with ${esc(p.compared_with)}`:`Original types: ${esc((p.source_labels||[]).join("; "))}`)+`<br>Approx. area: ${esc(p.area_km2_approx.toLocaleString())} km²`)}}).addTo(ol);
 drawFeat()}
/* Features panel: the day's map events and change patches; "Show on map" flies the map there (panel stays open) */
function drawFeat(){
 /* filters: source, side and kind (built from what is on the map today); untick to hide */
 const cb=(k,v,l)=>`<label><input type="checkbox" data-ff="${esc(k+"|"+v)}" ${fOn[k+"|"+v]===false?"":"checked"}> ${esc(l)}</label> `,
  uniq=g=>[...new Set(FL.flatMap(x=>[].concat(g(x.f.properties))))].sort();
 $("#pf").innerHTML=`<div class="mut">Source: ${uniq(srcNames).map(v=>cb("src",v,v)).join("")}</div>`+
  `<div class="mut">Side: ${uniq(fside).map(v=>cb("side",v,v)).join("")}</div>`+
  `<div class="mut" style="margin-bottom:6px">Kind: ${cb("kind","event","Map events")}${cb("kind","change","Area changes")}</div>`+
  `<input id="fq" class="fi" type="search" value="${esc(fq)}" placeholder="Search features (AND, OR, NOT, &quot;phrases&quot;)">`+
  `<p class="mut" style="margin:4px 0 8px">Newest first. Each entry is one event with all its sources (matched when they cite the same post). Times: the earliest report with a known time; WarSpotting gives a date only. War fires are map-only.</p><div id="flist"></div>`;
 listFeat()}
const fside=p=>p.period?"Area change":p.side||"Not stated",
 srcNames=p=>p.claims?[...new Set(p.claims.map(c=>c.source_name||c.source))]:[p.source_name],
 ptime=p=>p.time_utc||p.posted_utc||p.earliest_source_utc,
 fkey=p=>ptime(p)||(p.date||p.snapshot_time||"")+"T00:00",   /* date-only items sort after timed ones of the same day */
 fwhen=p=>p.time_utc?`earliest report ${p.time_utc.slice(0,10)} ${p.time_utc.slice(11,16)} UTC`:p.posted_utc?`posted ${p.posted_utc.slice(0,10)} ${p.posted_utc.slice(11,16)} UTC`:p.earliest_source_utc?`earliest source posted ${p.earliest_source_utc.slice(0,10)} ${p.earliest_source_utc.slice(11,16)} UTC`:p.period?`map of ${p.snapshot_time}`:`${p.date} (date only)`;
function listFeat(){

/* GeoTIFF upload: parsed and reprojected in the browser, nothing leaves the device */
