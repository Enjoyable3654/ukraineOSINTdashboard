name: Daily data update

on:
  schedule:
    - cron: "17 5 * * *"        # every day at 05:17 UTC (GitHub may start it a few minutes late)
  workflow_dispatch:            # lets you run it by hand from the Actions tab
    inputs:
      mode:
        description: "update = fetch and save everything. inspect = only print what one source returns, save nothing"
        type: choice
        options: [update, inspect]
        default: update
      source:
        description: "Source to inspect (only used in inspect mode)"
        default: deepstate
      lookback:
        description: "Optional: re-fetch this many days for every source (e.g. a one-time rebuild). Leave empty for normal runs."
        default: ""

permissions:
  contents: write               # lets the job save the new data files into the repo

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.inputs.mode }}
      SRC: ${{ github.event.inputs.source }}
      LOOKBACK: ${{ github.event.inputs.lookback }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shapely

      - name: Run updates (all of them live in update.py)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # set in the repo's Settings > Secrets; never stored in a file
        run: |
          if [ "$MODE" = "inspect" ]; then python update.py --inspect "${SRC:-deepstate}"; else python update.py ${LOOKBACK:+--lookback "$LOOKBACK"}; fi

      - name: Commit new data
        if: always() && github.event.inputs.mode != 'inspect'
        run: |
          mkdir -p data
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data $(date -u +%F)"
          git push
